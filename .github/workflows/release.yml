name: Release container

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/wolt
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - id: buildinfo
        name: Resolve build information
        run: |
          echo "commit_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WOLT_VERSION=${{ github.ref_name }}
            WOLT_COMMIT_SHA=${{ steps.buildinfo.outputs.commit_sha }}
            WOLT_BUILD_DATE=${{ steps.buildinfo.outputs.build_date }}
          provenance: mode=max
          sbom: true
      - name: Sign immutable release digest
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/wolt
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum install.sh > install.sh.sha256
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "WOLT ${GITHUB_REF_NAME}" \
            install.sh install.sh.sha256

  backfill-v1-1-3-major-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      IMAGE: runovel/wolt
      DIGEST: sha256:e9f9b29d6b232e68ddeb5451ee3618d4bf8c4585d41893ec0a01207f951ad90a
      TAG: "1"
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Backfill the v1 major alias without rebuilding
        run: |
          docker buildx imagetools create --tag "${IMAGE}:${TAG}" "${IMAGE}@${DIGEST}"
          actual="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" | awk '$1 == "Digest:" {print $2; exit}')"
          test "$actual" = "$DIGEST"
